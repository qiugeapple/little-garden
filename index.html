<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Garden · 云上的一扇窗</title><link rel="stylesheet" href="style.css?v=11"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<main class="app-window"><div id="scene" aria-label="交互花园：点击掌机选种子，点击泥土种植，拖动水壶浇水"></div><div class="loading" id="loading"><span>✿</span><b>打开云上的一扇窗</b><small id="load-text">请稍等片刻</small><div class="load-track"><i id="load-progress"></i></div></div><div id="hover-label" role="tooltip" hidden></div><div id="drag-hint" hidden>按住拖动 · 在花朵上方停留浇水</div><p id="status" role="status" aria-live="polite"></p><div class="flash" id="photo-flash"></div>
<section class="glass-panel" id="seed-window" aria-label="选择花种" hidden><header><span>一点小小的生长</span><button id="close-seeds" aria-label="关闭种子选择">×</button></header><p>今天，想让哪一朵花开在窗边？</p><div class="seed-options"><button data-pick="daisy"><i>✿</i><b>小雏菊</b><small>明亮与勇气</small></button><button data-pick="cosmos"><i>✿</i><b>波斯菊</b><small>轻轻的温柔</small></button><button data-pick="lavender"><i>❋</i><b>薰衣草</b><small>慢慢地呼吸</small></button><button data-pick="lily"><i>♧</i><b>铃兰</b><small>轻盈的祝福</small></button><button data-pick="bellflower"><i>♧</i><b>风铃草</b><small>风中的问候</small></button><button data-pick="ranunculus"><i>✿</i><b>毛茛</b><small>柔软的阳光</small></button></div><footer>选择后，点击花槽里的泥土。</footer></section>
<section class="glass-panel" id="help-window" aria-label="花园记录" hidden><header><span>Little Garden</span><button id="close-help" aria-label="关闭花园记录">×</button></header><p>留一点时间，让花慢慢开。</p><div class="garden-stats"><strong id="count">0 / 12</strong><span id="metrics">花园自动保存在这台设备上</span></div><div class="garden-actions"><button id="panel-seeds">选择花种</button><button id="undo" disabled>撤回上一株</button><button id="panel-photo">保存照片</button></div><div class="garden-actions"><button id="cycle-light">切换昼夜</button><button id="ambient-sound">环境音：开</button><button id="replay-entry">重看入场</button><button id="preview-reward">预览小屋奖励</button></div><p class="help-copy">点击掌机选花 · 点击泥土种植<br>按住水壶拖到花朵上方，停留浇水，松手归位。</p></section>
<section id="reward-scene" role="dialog" aria-modal="true" aria-label="云端小屋奖励" hidden><video playsinline preload="none" aria-label="云端小屋出场动画，配钢琴音乐"></video><button data-reward-close>返回花园</button><button data-reward-play hidden>播放动画与钢琴声</button></section></main>
<div class="legacy" hidden><button id="sound"></button><button id="desktop-garden"></button><button id="desktop-seeds"></button><button id="desktop-photo"></button><button id="desktop-help"></button><button id="menu-seeds"></button><button id="menu-help"></button><button id="open-seeds"></button><button id="start"></button><button id="task-garden"></button><span id="clock"></span><span id="selected-label"></span><button class="seed active" data-type="daisy"></button><button class="seed" data-type="cosmos"></button><button class="seed" data-type="lavender"></button><button id="water"></button><button id="demo"></button><button id="stop" hidden></button><input id="timeline" type="range" min="0" max="9.95" step=".04" value="0"><output id="time"></output></div>
<script type="module" src="app.js?v=11"></script></body></html>
